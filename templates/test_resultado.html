{% extends 'base.html' %}

{% block title %}Resultado del Test - CodeCrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 text-center">
            <h2>🎉 ¡Eres un programador <strong>{{ tipo }}</strong>!</h2>
            <p class="mt-4">Tu tipo de programador describe tu estilo y cómo te acercas a los problemas.</p>
            <div class="mt-3">
                <a href="{% url 'home' %}" class="btn btn-primary">
                    <i class="fas fa-home"></i> Ir al Inicio
                </a>
                <a href="{% url 'proyectos' %}" class="btn btn-success">
                    <i class="fas fa-code"></i> Ver Proyectos Recomendados
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
