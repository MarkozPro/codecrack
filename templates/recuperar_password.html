{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Recuperar Contraseña - CodeCrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div style="font-size: 4rem;">🔑</div>
                <h2>Recuperar Contraseña</h2>
                <p class="text-muted">
                    Escribe tu email y te enviaremos un código de 4 dígitos
                </p>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> Correo electrónico
                    </label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="tu-email@ejemplo.com"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-paper-plane"></i> Enviar Código
                </button>
            </form>

            <hr>

            <div class="text-center">
                <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100">
                    <i class="fas fa-arrow-left"></i> Volver al Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
