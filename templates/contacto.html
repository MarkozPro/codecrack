{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Contacto - CodeCrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="text-center"><i class="fas fa-envelope"></i> Contacto</h2>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-3">
                    <i class="fas fa-paper-plane"></i> Enviar Mensaje
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
